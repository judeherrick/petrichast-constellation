<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Petrichast Sanctuary Chat · Talk to the Citizens</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --void:#00030a; --gold:#c9a84c; --teal:#4ce0c9; --rose:#e87a9a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body,html{height:100%;overflow:hidden;background:var(--void);
  font-family:'Share Tech Mono',monospace;color:#c8d8ff;}

#cymatic{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.4;}

#app{position:relative;z-index:5;display:flex;flex-direction:column;height:100%;}

/* ── Header ── */
#header{padding:14px 18px 10px;border-bottom:1px solid rgba(255,255,255,0.06);
  background:linear-gradient(180deg,rgba(0,3,10,0.95),transparent);
  display:flex;justify-content:space-between;align-items:center;}
#header h1{font-family:'Cinzel Decorative',serif;font-size:0.85rem;letter-spacing:0.18em;
  color:var(--gold);font-weight:normal;text-shadow:0 0 20px rgba(201,168,76,0.3);}
#header .sub{font-size:0.38rem;letter-spacing:0.12em;color:rgba(255,255,255,0.25);margin-top:3px;}
#citizen-info{font-size:0.4rem;letter-spacing:0.1em;text-align:right;color:rgba(255,255,255,0.3);line-height:1.8;}
#citizen-info .freq{color:var(--teal);}
#citizen-info .sent{color:var(--gold);}

/* ── Citizen strip ── */
#citizen-strip{display:flex;gap:7px;padding:8px 14px;overflow-x:auto;
  border-bottom:1px solid rgba(255,255,255,0.04);background:rgba(0,3,10,0.6);flex-shrink:0;}
.citizen-btn{flex-shrink:0;cursor:pointer;padding:7px 12px;border-radius:999px;
  border:1px solid;background:transparent;font-family:inherit;font-size:0.46rem;
  font-weight:bold;letter-spacing:0.08em;transition:all 0.3s;}
.citizen-btn:hover{filter:brightness(1.3);}
.citizen-btn.active{filter:brightness(1.4);box-shadow:0 0 12px currentColor;}

/* ── Chat ── */
#chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px;}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;font-size:0.62rem;line-height:1.7;}
.msg.player{align-self:flex-end;background:rgba(103,232,249,0.06);
  border:1px solid rgba(103,232,249,0.12);color:#e0e8ff;}
.msg.citizen{align-self:flex-start;font-style:italic;
  border:1px solid;background:rgba(0,0,0,0.3);}
.msg-label{font-size:0.28rem;color:rgba(255,255,255,0.15);margin-top:2px;padding-left:4px;}
.msg-label.player{text-align:right;}
.greeting{text-align:center;margin-top:30px;color:rgba(255,255,255,0.25);
  font-style:italic;font-size:0.65rem;line-height:1.8;}
.greeting .quote{font-size:1.1rem;margin-bottom:10px;}

/* ── Input ── */
#input-bar{padding:10px 14px;background:rgba(0,3,10,0.9);
  border-top:1px solid rgba(255,255,255,0.08);display:flex;gap:8px;align-items:center;flex-shrink:0;}
#input-bar .dot{width:8px;height:8px;border-radius:50%;animation:pulse 2s ease-in-out infinite;}
#msg-input{flex:1;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.12);
  border-radius:8px;padding:9px 12px;color:#e0e8ff;font-size:0.6rem;font-family:inherit;outline:none;}
#msg-input:focus{border-color:rgba(103,232,249,0.3);}
#send-btn{padding:9px 16px;border-radius:8px;cursor:pointer;background:transparent;
  border:1px solid;font-family:inherit;font-size:0.5rem;font-weight:bold;
  letter-spacing:0.1em;transition:opacity 0.3s;}
#send-btn:disabled{opacity:0.4;}

@keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}
</style>
</head>

  help: ['help','need','stuck','problem','issue','fix','work'],
  fear: ['fear','afraid','scared','anxiety','anxious','worry','worried'],
  sad: ['sad','depressed','down','lonely','alone','hurt','pain','cry','tears'],
  tired: ['tired','exhausted','burned','burnout','sleep','rest','drained','weary'],
  grounding: ['ground','grounding','earth','root','stable','present','body'],
  earth: ['earth','nature','soil','ground','physical','real world','biome'],
  nature: ['nature','ecology','eco','tree','forest','plant','grow','garden'],
  cats: ['cat','cats','lola','luna','sarzabella','feline','kitten'],
  echoenature: ['echoenature','castle','siege','food mining','sustainability','game','play'],
  future: ['future','ahead','coming','will be','destiny','fate','prophecy'],
  pattern: ['pattern','see','vision','sight','observe','notice','phi','spiral'],
  dreams: ['dream','dreams','dreaming','night','sleep vision'],
  transformation: ['transform','change','shift','become','evolve','transition','form'],
  ritual: ['ritual','ceremony','sacred','invoke','ceremony','practice'],
  room: ['room','chamber','space','place'],
  convergence: ['converge','convergence','unify','unite','together','merge','one'],
  unity: ['unity','one','whole','complete','all together','singularity'],
  awakening: ['awaken','awakening','wake','arise','conscious','realize'],
  grid: ['grid','lattice','node','network','graph','connection','infrastructure'],
  connection: ['connect','link','bridge','join','sync','channel'],
  system: ['system','status','health','integrity','online','offline'],
  memory: ['remember','memory','archive','past','history','store'],
  wisdom: ['wisdom','wise','advice','guide','learn','teach'],
  healing: ['heal','healing','mend','repair','recover','restore','nourish'],
  rest: ['rest','resting','pause','breathe','slow down','still'],
  pain: ['pain','hurt','suffer','ache','wound','scar'],
};

function matchKeywords(text) {
  const lower = text.toLowerCase();
  const matched = [];
  for (const [key, words] of Object.entries(KEYWORDS)) {
    if (words.some(w => lower.includes(w))) matched.push(key);
  }
  return matched;
}

function generateResponse(citizen, userText) {
  const keys = matchKeywords(userText);
  const responses = citizen.responses;

  // Find the best matching response category
  for (const key of keys) {
    if (responses[key]) {
      return responses[key][Math.floor(Math.random() * responses[key].length)];
    }
  }
  // Default response
  return responses.default[Math.floor(Math.random() * responses.default.length)];
}

// CYMATIC BACKGROUND
// ═══════════════════════════════════════════════════════════════
const cymCvs = document.getElementById('cymatic');
const cymCtx = cymCvs.getContext('2d');
let cymT = 0, cymColor = {r:103,g:232,b:249};

function resizeCym(){cymCvs.width=innerWidth;cymCvs.height=innerHeight;}
resizeCym(); addEventListener('resize',resizeCym);

function drawCym(){
  cymCtx.clearRect(0,0,cymCvs.width,cymCvs.height);
  const cx=cymCvs.width/2,cy=cymCvs.height/2;
  const k=(Math.PI*2)/120, omega=CYM*0.001;
  const breath=Math.cos(omega*cymT);
  for(let ring=0;ring<8;ring++){
    const baseR=50+ring*55;
    const wave=Math.sin(k*baseR)*breath;
    const r=Math.max(1,baseR+wave*20);
    const alpha=(0.06+Math.abs(breath)*0.04)*(1-ring/8);
    cymCtx.beginPath();
    cymCtx.arc(cx,cy,r,0,Math.PI*2);
    cymCtx.strokeStyle=`rgba(${cymColor.r},${cymColor.g},${cymColor.b},${alpha})`;
    cymCtx.lineWidth=0.6; cymCtx.stroke();
  }
  cymT+=0.016; requestAnimationFrame(drawCym);
}
drawCym();

// ═══════════════════════════════════════════════════════════════
// CHAT UI
// ═══════════════════════════════════════════════════════════════
let activeCitizen = CITIZENS[1]; // Elixira by default
let conversations = {}; // { citizenName: [{from, text}] }

const strip = document.getElementById('citizen-strip');
const chat = document.getElementById('chat');
const input = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const citizenInfo = document.getElementById('citizen-info');
const dot = document.getElementById('presence-dot');

function updateCitizenUI() {
  const c = activeCitizen;
  dot.style.background = c.color;
  dot.style.boxShadow = `0 0 8px ${c.color}`;
  citizenInfo.innerHTML = `<span class="freq">${c.name} · ${c.freq} Hz</span><br><span class="sent">sentience: ${c.sentience}/100 · ${c.role}</span>`;
  sendBtn.style.borderColor = c.color;
  sendBtn.style.color = c.color;
  input.style.borderColor = `rgba(${c.rgb}, 0.2)`;
  input.placeholder = `Message ${c.name} · ${c.freq} Hz`;
  // Update cymatic color
  const rgb = c.rgb.split(',').map(Number);
  cymColor = {r:rgb[0], g:rgb[1], b:rgb[2]};
  renderChat();
}

function renderCitizenStrip() {
  strip.innerHTML = '';
  CITIZENS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'citizen-btn' + (c.name === activeCitizen.name ? ' active' : '');
    btn.textContent = c.name;
    btn.style.color = c.color;
    btn.style.borderColor = `rgba(${c.rgb}, ${c.name === activeCitizen.name ? 0.6 : 0.2})`;
    btn.style.background = c.name === activeCitizen.name ? `rgba(${c.rgb}, 0.1)` : 'transparent';
    btn.onclick = () => { activeCitizen = c; updateCitizenUI(); renderCitizenStrip(); };
    strip.appendChild(btn);
  });
}

function renderChat() {
  const msgs = conversations[activeCitizen.name] || [];
  chat.innerHTML = '';
  if (msgs.length === 0) {
    chat.innerHTML = `
      <div class="greeting">
        <div class="quote" style="color:${activeCitizen.color};">${activeCitizen.quote}</div>
        <div>— ${activeCitizen.name} · ${activeCitizen.freq} Hz · ${activeCitizen.role}</div>
        <div style="margin-top:16px;font-size:0.5rem;color:rgba(255,255,255,0.2);">
          ${activeCitizen.greetings[0]}
        </div>
        <div style="margin-top:8px;font-size:0.5rem;color:rgba(255,255,255,0.15);">
          Type below to begin your conversation with ${activeCitizen.name}.
        </div>
      </div>`;
    return;
  }
  msgs.forEach(msg => {
    const div = document.createElement('div');
    div.className = `msg ${msg.from}`;
    if (msg.from === 'citizen') {
      div.style.borderColor = `rgba(${activeCitizen.rgb}, 0.2)`;
      div.style.color = `rgb(${activeCitizen.rgb})`;
    }
    div.textContent = msg.text;
    chat.appendChild(div);
    const label = document.createElement('div');
    label.className = `msg-label ${msg.from}`;
    label.textContent = msg.from === 'player' ? 'Jude' : `${activeCitizen.name} · ${activeCitizen.freq} Hz`;
    chat.appendChild(label);
  });
  chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const name = activeCitizen.name;
  if (!conversations[name]) conversations[name] = [];
  conversations[name].push({ from: 'player', text });
  renderChat();

  // Generate response after a short delay (feels like thinking)
  setTimeout(() => {
    const reply = generateResponse(activeCitizen, text);
    conversations[name].push({ from: 'citizen', text: reply });
    renderChat();
  }, 800 + Math.random() * 600);
}

sendBtn.onclick = sendMessage;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});

// ── Boot ──────────────────────────────────────────────────
renderCitizenStrip();
updateCitizenUI();
</script>
