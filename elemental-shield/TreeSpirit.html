// ── Sustainability Meter ───────────────────────────────────
let meterValue = 10;
function getMeterState() {
  if (meterValue < 20)  return 'critical';
  if (meterValue < 40)  return 'fragile';
  if (meterValue < 60)  return 'stable';
  if (meterValue < 80)  return 'flourishing';
  return 'resonant';
}
function raiseMeter(v) {
  const prev = getMeterState();
  meterValue = Math.min(100, meterValue + v);
  onMeterChange(prev);
}
function lowerMeter(v) {
  const prev = getMeterState();
  meterValue = Math.max(0, meterValue - v);
  onMeterChange(prev);
}
function onMeterChange(prevState) {
  const cur = getMeterState();
  updateMeterUI();
  if (cur !== prevState) {
    spirit.transitionToState(cur, prevState);
  } else {
    if (Math.random() < 0.5) spirit.speak('ecological');
  }
}
function updateMeterUI() {
  document.getElementById('meter-val').textContent = Math.round(meterValue);
  document.getElementById('meter-bar-inner').style.width = meterValue + '%';
  const czBtn = document.getElementById('btn-czarina');
  czBtn.style.opacity = getMeterState() === 'resonant' ? '1' : '0.3';
}

// ── Audio ─────────────────────────────────────────────────
let audioCtx = null, humOsc = null, humGain = null, audioOn = false;
function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function toggleAudio() {
  if (!audioCtx) initAudio();
  if (audioOn) {
    if (humOsc) { try { humOsc.stop(); } catch(_){} humOsc=null; }
    audioOn = false;
    document.getElementById('audio-badge').textContent = '◈ AUDIO OFF';
    document.getElementById('audio-badge').classList.remove('on');
  } else {
    audioOn = true;
    startHum(spirit.currentFreq() * 12);
    document.getElementById('audio-badge').textContent = '◈ 7.83Hz LIVE';
    document.getElementById('audio-badge').classList.add('on');
  }
}
function startHum(freq) {
  if (!audioCtx || !audioOn) return;
  if (humOsc) { try { humOsc.stop(); } catch(_){} }
  humOsc  = audioCtx.createOscillator();
  humGain = audioCtx.createGain();
  humOsc.type = 'triangle';
  humOsc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  humGain.gain.setValueAtTime(0, audioCtx.currentTime);
  humGain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 1.5);
  humOsc.connect(humGain); humGain.connect(audioCtx.destination);
  humOsc.start();
}
function chime(freq, dur=1200) {
  if (!audioCtx || !audioOn) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  g.gain.setValueAtTime(0, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0.07, audioCtx.currentTime+0.08);
  g.gain.linearRampToValueAtTime(0, audioCtx.currentTime+dur/1000);
  o.connect(g); g.connect(audioCtx.destination); o.start();
  setTimeout(()=>{try{o.stop();}catch(_){}}, dur+200);
}

// ── Particle System ───────────────────────────────────────
class ParticleSystem {
  constructor() { this.p = []; }
  spawn(cx, cy, stDef, count=3) {
    for (let i=0; i<count; i++) {
      const type = stDef.particleType;
      this.p.push({
        type,
        x: cx + (Math.random()-0.5)*120,
        y: cy + (Math.random()-0.2)*180,
        vx:(Math.random()-0.5)*0.4,
        vy:-(0.3+Math.random()*0.6),
        life:1, decay:0.004+Math.random()*0.004,
        size:type==='aurora'?4+Math.random()*5:2+Math.random()*3,
        hue: type==='ash'?30+Math.random()*20:
             type==='moss_spores'?100+Math.random()*30:
             type==='pollen'?55+Math.random()*20:
             type==='fireflies'?95+Math.random()*25:
             130+Math.random()*30,
        bright: type==='fireflies'||type==='aurora',
      });
    }
    while(this.p.length>200) this.p.shift();
  }
  update() {
    this.p=this.p.filter(p=>p.life>0);
    this.p.forEach(p=>{
      p.x+=p.vx+(Math.random()-0.5)*0.2;
      p.y+=p.vy;
      p.vy*=0.995;
      p.life-=p.decay;
    });
  }
  draw(ctx) {
    this.p.forEach(p=>{
      const a=p.life*0.6;
      ctx.save();
      ctx.globalAlpha=a;
      if(p.bright){
        ctx.shadowBlur=12; ctx.shadowColor=`hsl(${p.hue},100%,75%)`;
      }
      ctx.fillStyle=`hsl(${p.hue},80%,65%)`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(0.5+p.life*0.5),0,TAU);
      ctx.fill();
      ctx.restore();
    });
  }
}

// ── Roots ──────────────────────────────────────────────────
class RootSystem {
  constructor(count=8) {
    this.roots=Array.from({length:count},(_,i)=>({
      angle: (i/count)*TAU + Math.random()*0.3,
      len:   0.28+Math.random()*0.22,
      phase: Math.random()*TAU,
      ctrl:  Math.random()*0.18+0.08,
      width: 1+Math.random()*1.5,
    }));
  }
  draw(ctx, cx, cy, scale, stDef, t, trustFactor) {
    const vis = {critical:0.08,fragile:0.18,stable:0.28,flourishing:0.42,resonant:0.6}[stDef.name.toLowerCase()]||0.2;
    this.roots.forEach(r=>{
      const len = scale*(r.len+0.12*trustFactor);
      const ctrl= scale*r.ctrl;
      ctx.save();
      ctx.globalAlpha=vis*(0.7+0.3*trustFactor);
      ctx.strokeStyle=stDef.glow;
      ctx.lineWidth=r.width*(1+trustFactor*0.5);
      ctx.shadowBlur=6+trustFactor*8; ctx.shadowColor=stDef.glow;
      ctx.beginPath();
      ctx.moveTo(cx, cy+scale*0.28);
      ctx.quadraticCurveTo(
        cx+Math.cos(r.angle+0.4+t*0.05)*ctrl,
        cy+scale*0.28+Math.sin(t*0.15+r.phase)*ctrl*0.35,
        cx+Math.cos(r.angle)*len,
        cy+scale*0.28+Math.sin(r.angle)*len*0.32
      );
      ctx.stroke();
      ctx.restore();
    });
  }
}

// ── Firefly flock ──────────────────────────────────────────
class FireflyFlock {
  constructor(count=18) {
    this.flies=Array.from({length:count},()=>({
      x: (Math.random()-0.5)*2,
      y: (Math.random()-0.5)*1.5,
      phase:Math.random()*TAU,
      speed:0.0004+Math.random()*0.0006,
      size:1.5+Math.random()*2,
      hue: 95+Math.random()*25,
    }));
  }
  draw(ctx, cx, cy, scale, stDef, t, vis) {
    if(vis<0.3) return;
    this.flies.forEach(f=>{
      f.x+=Math.sin(t*f.speed+f.phase)*0.003+(Math.random()-0.5)*0.001;
      f.y+=Math.cos(t*f.speed*0.7+f.phase)*0.002;
      const glow = 0.5+0.5*Math.sin(t*0.008+f.phase);
      ctx.save();
      ctx.globalAlpha=vis*glow*0.8;
      ctx.shadowBlur=10; ctx.shadowColor=`hsl(${f.hue},100%,75%)`;
      ctx.fillStyle=`hsl(${f.hue},90%,70%)`;
      ctx.beginPath();
      ctx.arc(cx+f.x*scale*0.6, cy+f.y*scale*0.5, f.size*glow, 0, TAU);
      ctx.fill();
      ctx.restore();
    });
  }
}

    this._particles  = new ParticleSystem();
    this._roots      = new RootSystem(9);
    this._fireflies  = new FireflyFlock(22);

    this._lastDialogueIdx = {};
    this._dialogueQueue   = [];
    this._curLine         = null;
    this._lineProgress    = 0;
    this._linePause       = 0;

    this._met         = false;
    this._eyePulse    = 0;
    this._leafAngle   = 0;
  }

  currentFreq() { return STATES[this._state].freq; }
  currentDef()  { return STATES[this._state]; }

  transitionToState(newState, prevState) {
    this._fromState  = this._state;
    this._state      = newState;
    this._transition = 0;

    const isPositive = STATE_ORDER.indexOf(newState) > STATE_ORDER.indexOf(prevState);
    if (isPositive) {
      this._trust = Math.min(1, this._trust + 0.12);
      chime(this.currentFreq() * 80, 2000);
      setTimeout(()=> this.speak('ecological'), 1400);
    } else {
      chime(this.currentFreq() * 60, 1600);
    }

    this._particles.spawn(worldC.width/2, worldC.height*0.42, this.currentDef(), 30);
    updateStateBadge(newState);

    // Czarina button
    document.getElementById('btn-czarina').style.opacity = newState==='resonant'?'1':'0.3';
  }

  speak(layer, index=-1) {
    const bank = DIALOGUE[this._state]?.[layer];
    if (!bank || bank.length===0) {
      if (layer!=='emotional') return this.speak('emotional');
      return;
    }
    const key = `${this._state}:${layer}`;
    const last = this._lastDialogueIdx[key] ?? -1;
    const pick = index>=0 ? index : (last+1) % bank.length;
    this._lastDialogueIdx[key] = pick;
    const line = bank[pick];
    this._dialogueQueue.push({ text:line, layer, state:this._state });
  }

  speakCzarina() {
    if (this._state !== 'resonant') return;
    const bridge = DIALOGUE.resonant.bridge;
    this._dialogueQueue.push({ text:bridge[2], layer:'bridge', state:'resonant' });
  }

  sayExact(text) {
    this._dialogueQueue.push({ text, layer:'special', state:this._state });
  }

  update(dt) {
    this._t       += dt;
    this._phase   += dt * this.currentFreq() * 0.012;
    this._breathe += dt * 0.9;
    this._rootPh  += dt * 0.35;
    this._eyePulse+= dt * 1.4;
    this._leafAngle+=dt * 0.04;

    if (this._transition < 1) this._transition = Math.min(1, this._transition + dt*0.4);

    this._particles.update();

    // Organic speech
    if (Math.floor(this._t * 0.05) !== Math.floor((this._t - dt) * 0.05)) {
      if (Math.random() < 0.12 + this._trust*0.15 && this._state!=='critical') {
        const layers=['ecological','emotional','functional'];
        this.speak(layers[Math.floor(Math.random()*layers.length)]);
      }
    }

    // Spawn particles continuously
    if (Math.round(this._t) % 3 === 0 && Math.random()<0.4) {
      const cx=worldC.width/2, cy=worldC.height*0.42;
      this._particles.spawn(cx, cy, this.currentDef(), 2);
    }

    // First meeting
    if (!this._met && this._t > 2.5) {
      this._met = true;
      setTimeout(()=>this.speak('emotional',0), 500);
    }
  }

  // ── Render background (forest floor, sky) ────────────────
  drawBackground() {
    const W=bgC.width, H=bgC.height;
    const def=this.currentDef();
    bgCtx.fillStyle=def.skyTop;
    bgCtx.fillRect(0,0,W,H);

    // Vertical gradient sky
    const sky=bgCtx.createLinearGradient(0,0,0,H*0.7);
    sky.addColorStop(0, def.skyTop);
    sky.addColorStop(1, def.skyBot);
    bgCtx.fillStyle=sky; bgCtx.fillRect(0,0,W,H*0.7);

    // Distant forest silhouette
    const ground=bgCtx.createLinearGradient(0,H*0.55,0,H);
    ground.addColorStop(0, def.groundCol+'88');
    ground.addColorStop(1, def.groundCol);
    bgCtx.fillStyle=ground; bgCtx.fillRect(0,H*0.55,W,H*0.45);

    // Distant tree suggestions
    bgCtx.globalAlpha=0.15+this._trust*0.15;
    bgCtx.fillStyle=def.glow;
    for(let tx=0;tx<W;tx+=40+Math.floor(Math.sin(tx)*12)) {
      const th=60+Math.sin(tx*0.07)*30+this._trust*20;
      const ty=H*0.55-th*0.4;
      bgCtx.beginPath();
      bgCtx.arc(tx, ty, 14+Math.sin(tx*0.1)*6, 0, TAU);
      bgCtx.fill();
    }
    bgCtx.globalAlpha=1;

    // Ground mist
    const mist=bgCtx.createLinearGradient(0,H*0.62,0,H*0.72);
    mist.addColorStop(0,'rgba(0,0,0,0)');
    mist.addColorStop(0.5,def.fogColor+'0.06)');
    mist.addColorStop(1,'rgba(0,0,0,0)');
    bgCtx.fillStyle=mist; bgCtx.fillRect(0,H*0.62,W,H*0.1);
  }

  // ── Main render ───────────────────────────────────────────
  render(t) {
    const W=worldC.width, H=worldC.height;
    const cx=W/2, cy=H*0.42;
    const scale=Math.min(W,H)*0.28;
    const def=this.currentDef();
    const trust=this._trust;

    wCtx.clearRect(0,0,W,H);

    // Fade trail
    wCtx.fillStyle='rgba(0,0,0,0.06)';
    wCtx.fillRect(0,0,W,H);

    const breath=1+0.022*Math.sin(this._breathe);
    const stateVis={critical:0.3,fragile:0.55,stable:0.78,flourishing:0.92,resonant:1.0}[this._state]||0.5;

    // ── Outer aura ─────────────────────────────────────────
    const auraR=scale*(0.85+trust*0.35)*breath;
    const aura =wCtx.createRadialGradient(cx,cy,0,cx,cy,auraR);
    const [ar,ag,ab]=def.auraHue.split(',');
    aura.addColorStop(0,  `rgba(${ar},${ag},${ab},${0.08*stateVis})`);
    aura.addColorStop(0.4,`rgba(${ar},${ag},${ab},${0.06*stateVis})`);
    aura.addColorStop(1,  'rgba(0,0,0,0)');
    wCtx.globalAlpha=1; wCtx.fillStyle=aura;
    wCtx.beginPath(); wCtx.arc(cx,cy,auraR,0,TAU); wCtx.fill();

    // ── Root network ────────────────────────────────────────
    this._roots.draw(wCtx, cx, cy, scale, def, t, trust);

    // ── Ground glow ─────────────────────────────────────────
    const gGlow=wCtx.createRadialGradient(cx,cy+scale*0.3,0,cx,cy+scale*0.3,scale*0.5);
    gGlow.addColorStop(0,`rgba(${ar},${ag},${ab},${0.12*stateVis})`);
    gGlow.addColorStop(1,'rgba(0,0,0,0)');
    wCtx.fillStyle=gGlow;
    wCtx.beginPath(); wCtx.arc(cx,cy+scale*0.3,scale*0.5,0,TAU); wCtx.fill();

    // ── Trunk ───────────────────────────────────────────────
    const trunkH=scale*0.72*breath;
    const trunkW=scale*0.15;
    wCtx.globalAlpha=stateVis*(0.65+trust*0.25);
    const trunkGrd=wCtx.createLinearGradient(cx-trunkW,cy-trunkH*0.4,cx+trunkW,cy+trunkH*0.5);
    trunkGrd.addColorStop(0, def.glow+'aa');
    trunkGrd.addColorStop(0.5,def.col+'cc');
    trunkGrd.addColorStop(1, def.glow+'55');
    wCtx.fillStyle=trunkGrd;

    // Trunk shape — slightly organic
    wCtx.beginPath();
    wCtx.moveTo(cx-trunkW*0.7, cy+trunkH*0.45);
    wCtx.bezierCurveTo(
      cx-trunkW*(0.9+0.1*Math.sin(t*0.3)), cy,
      cx-trunkW*(0.8+0.1*Math.sin(t*0.2)), cy-trunkH*0.3,
      cx+Math.sin(t*0.1)*trunkW*0.15, cy-trunkH*0.48
    );
    wCtx.bezierCurveTo(
      cx+trunkW*(0.85+0.1*Math.sin(t*0.25)), cy-trunkH*0.3,
      cx+trunkW*(0.92+0.1*Math.sin(t*0.18)), cy,
      cx+trunkW*0.7, cy+trunkH*0.45
    );
    wCtx.closePath(); wCtx.fill();

    // Bioluminescent veins
    if(this._state!=='critical') {
      wCtx.globalAlpha=stateVis*(0.18+trust*0.28);
      wCtx.strokeStyle=def.glow; wCtx.lineWidth=0.8;
      wCtx.shadowBlur=6; wCtx.shadowColor=def.glow;
      for(let v=0;v<5;v++) {
        wCtx.beginPath();
        const vx=cx+(v-2)*trunkW*0.28;
        wCtx.moveTo(vx,cy+trunkH*0.38);
        for(let s=1;s<=10;s++) {
          const st=s/10;
          wCtx.lineTo(
            vx+Math.sin(this._phase*1.5+v*1.3+st*4)*trunkW*0.18,
            cy+trunkH*0.38-st*trunkH*0.88
          );
        }
        wCtx.stroke();
      }
      wCtx.shadowBlur=0;
    }

    // ── Canopy layers ────────────────────────────────────────
    const canopyCount={critical:0,fragile:2,stable:4,flourishing:7,resonant:10}[this._state]||0;
    for(let l=0;l<canopyCount;l++) {
      const cr   =scale*(0.32+l*0.07)*breath;
      const coy  =cy-trunkH*0.28-l*scale*0.065;
      const cox  =cx+Math.sin(this._leafAngle+l*0.6)*scale*0.04;
      const alpha=(0.10+trust*0.12)*(1-l/(canopyCount+1))*stateVis;
      wCtx.globalAlpha=alpha;
      const leafGrd=wCtx.createRadialGradient(cox,coy,0,cox,coy,cr);
      leafGrd.addColorStop(0, def.col+'dd');
      leafGrd.addColorStop(0.6,def.glow+'88');
      leafGrd.addColorStop(1,'rgba(0,0,0,0)');
      wCtx.fillStyle=leafGrd;
      wCtx.beginPath(); wCtx.arc(cox,coy,cr,0,TAU); wCtx.fill();
    }

    // ── Amber eyes ──────────────────────────────────────────
    if(this._state!=='critical') {
      const eyeAlpha=stateVis*(0.5+trust*0.4);
      const eyeY   =cy-trunkH*0.08;
      const eyeGap =trunkW*0.52;
      const eyeR   =trunkW*(0.18+trust*0.08);
      const eyeGlow=0.6+0.4*Math.sin(this._eyePulse);

      [-1,1].forEach(side=>{
        const ex=cx+side*eyeGap;
        // Outer amber ring
        wCtx.globalAlpha=eyeAlpha*eyeGlow;
        wCtx.shadowBlur=14+trust*10; wCtx.shadowColor='#ffcc66';
        wCtx.fillStyle='#cc8833';
        wCtx.beginPath(); wCtx.arc(ex,eyeY,eyeR,0,TAU); wCtx.fill();
        // Sap pupil
        wCtx.fillStyle='#664400'; wCtx.shadowBlur=0;
        wCtx.beginPath(); wCtx.arc(ex,eyeY,eyeR*0.42,0,TAU); wCtx.fill();
        // Inner catch-light
        wCtx.globalAlpha=eyeAlpha*0.7;
        wCtx.fillStyle='#ffdd88';
        wCtx.beginPath(); wCtx.arc(ex-eyeR*0.18,eyeY-eyeR*0.18,eyeR*0.15,0,TAU); wCtx.fill();
        wCtx.shadowBlur=0;
      });
    }

    // ── Particles ────────────────────────────────────────────
    wCtx.globalAlpha=stateVis;
    this._particles.draw(wCtx);

    // ── Fireflies (Flourishing+) ─────────────────────────────
    const flyVis={critical:0,fragile:0,stable:0.2,flourishing:0.7,resonant:1.0}[this._state]||0;
    this._fireflies.draw(wCtx,cx,cy,scale,def,t,flyVis);

    // ── Resonant heartbeat ring ──────────────────────────────
    if(this._state==='resonant') {
      const hbPulse=0.5+0.5*Math.sin(this._phase*2.2);
      wCtx.globalAlpha=hbPulse*0.22;
      wCtx.strokeStyle=def.col; wCtx.lineWidth=2;
      wCtx.shadowBlur=22; wCtx.shadowColor=def.glow;
      wCtx.beginPath();
      wCtx.arc(cx,cy,scale*(0.48+hbPulse*0.12),0,TAU);
      wCtx.stroke();
      // Second ring (phi-scaled)
      wCtx.globalAlpha=hbPulse*0.12;
      wCtx.beginPath();
      wCtx.arc(cx,cy,scale*(0.48+hbPulse*0.12)*PHI,0,TAU);
      wCtx.stroke();
      wCtx.shadowBlur=0;
    }

    // ── Transition bloom ─────────────────────────────────────
    if(this._transition<1) {
      const tp=1-this._transition;
      wCtx.globalAlpha=tp*0.18;
      wCtx.fillStyle=def.col;
      wCtx.beginPath(); wCtx.arc(cx,cy,scale*(1+tp*0.4)*breath,0,TAU);
      wCtx.fill();
    }

    wCtx.globalAlpha=1;
  }

  // ── Dialogue render ───────────────────────────────────────
  tickDialogue(dt) {
    if(!this._curLine && this._dialogueQueue.length>0) {
      this._curLine    =this._dialogueQueue.shift();
      this._lineProgress=0;
      this._linePause  =0;
      document.getElementById('dialogue-wrap').classList.add('show');
    }
    if(!this._curLine) {
      document.getElementById('dialogue-wrap').classList.remove('show');
      return;
    }

    const def=STATES[this._curLine.state]||this.currentDef();
    const speed=def.name==='Critical'?0.012:0.018;
    this._lineProgress=Math.min(1, this._lineProgress+speed);

    const full=this._curLine.text;
    const vis =full.slice(0, Math.floor(this._lineProgress*full.length));
    document.getElementById('dialogue-text').textContent=vis;
    document.getElementById('dialogue-text').style.color=def.col;

    if(this._lineProgress>=1) {
      this._linePause+=dt;
      const waitFor=2.5+full.length*0.025;
      if(this._linePause>=waitFor) {
        this._curLine=null; this._linePause=0;
      }
    }
  }
}

// ── State badge update ────────────────────────────────────
function updateStateBadge(state) {
  const def=STATES[state];
  document.getElementById('state-name').textContent=def.name.toUpperCase();
  document.getElementById('state-name').style.color=def.glow;
  document.getElementById('state-name').style.textShadow=`0 0 10px ${def.glow}`;
  document.getElementById('state-freq').textContent=def.freqLabel;
  document.getElementById('meter-bar-inner').style.background=
    `linear-gradient(90deg, ${def.glow}88, ${def.col}, ${def.col}cc)`;
}

// ── Instantiate ───────────────────────────────────────────
const spirit = new TreeSpirit();
updateMeterUI();
updateStateBadge('critical');

// ── Main loop ─────────────────────────────────────────────
let last=0;
function loop(ts) {
  const dt=(ts-last)/1000; last=ts;
  const safe=Math.min(dt,0.05);

  spirit.drawBackground();
  spirit.update(safe);
  spirit.render(spirit._t);
  spirit.tickDialogue(safe);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── Keyboard shortcuts ────────────────────────────────────
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowUp')   raiseMeter(8);
  if(e.key==='ArrowDown') lowerMeter(8);
  if(e.key==='m')         toggleAudio();
  if(e.key==='1')         spirit.speak('emotional');
  if(e.key==='2')         spirit.speak('memory');
  if(e.key==='3')         spirit.speak('ecological');
  if(e.key==='4')         spirit.speak('functional');
  if(e.key==='5')         spirit.speakCzarina();
});

console.log('%cThe Tree Spirit is alive.','color:#8abf6a;font-size:1rem');
console.log('%c7.83Hz Schumann · fgs_inga lineage · Petrichast Sanctuary','color:#4a7a2a;font-size:0.8rem');
console.log('%c↑↓ arrow keys to change meter · m for audio · 1-5 for dialogue','color:#2a4a1a;font-size:0.75rem');
</script>
