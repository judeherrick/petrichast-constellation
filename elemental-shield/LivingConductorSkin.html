<script>
// ════════════════════════════════════════════════════════════════════════
// PETRICHAST · AETHERSHIP · LIVING CONDUCTOR SKIN
// Full implementation: LivingMapOfIntent · RedSwanSwirlAR · CzarinaOracle
// · SenseVein gesture bridge · AdaptiveSpatialWrapper physics
// · Three.js spatial canvas · MediaPipe hands · Aether Gateway
// ════════════════════════════════════════════════════════════════════════

const PHI          = 1.6180339887;
const TAU          = Math.PI * 2;
const GATEWAY_URL  = 'http://localhost:8444';

// ════════════════════════════════════════════════════════════════════════
// LIVING MAP OF INTENT
// Conductor: resolves multi-modal observations into a physics profile.
// Tension formula integrates chemical stress, thermal delta,
// audio coherence, and gesture intensity into a single scalar.
// ════════════════════════════════════════════════════════════════════════

const UI_PROFILES = {
  EQUILIBRIUM: { stiffness:0.028, damping:0.82,  mass:1.0,  breathDuration:8,  blur:10,  mode:'Centered',     vignette:0.0 },
  AMBIENT:     { stiffness:0.12,  damping:0.65,  mass:1.0,  breathDuration:8,  blur:10,  mode:'Underdamped',  vignette:0.0 },
  GROUNDING:   { stiffness:0.04,  damping:0.95,  mass:4.5,  breathDuration:19, blur:40,  mode:'Overdamped',   vignette:0.72 },
  LUMINA_FLIGHT:{ stiffness:0.22, damping:0.48,  mass:0.6,  breathDuration:5,  blur:6,   mode:'Underdamped',  vignette:0.0 },
};

class LivingMapOfIntent {
  constructor() {
    this.mode     = 'EQUILIBRIUM';
    this.profile  = { ...UI_PROFILES.EQUILIBRIUM };
    this._lerpFrom= { ...UI_PROFILES.EQUILIBRIUM };
    this._lerpTo  = { ...UI_PROFILES.EQUILIBRIUM };
    this._lerpT   = 1.0;
    this._lerpDur = 2200;
    this._lerpStart = 0;
    this._lastMode  = 'EQUILIBRIUM';
  }

  // Resolve multi-modal observations → physics mode
  resolve(obs) {
    const {
      chemical_stress   = 0.3,
      thermal_delta     = 0.0,
      audio_coherence   = 0.8,
      gesture_intensity = 0.0,
      coherence         = 0.72,
    } = obs;

    const tension =
      chemical_stress   * 0.45 +
      Math.abs(thermal_delta) * 0.25 -
      audio_coherence   * 0.35 +
      gesture_intensity * 0.20;

    let newMode;
    let newProfile;

    if (tension > 0.62) {
      newMode    = 'GROUNDING';
      // Stiffness and mass scale with tension severity
      const t    = Math.min(1.0, tension);
      newProfile = {
        stiffness:     Math.max(0.018, 0.045 - t * 0.04),
        damping:       Math.min(0.98,  0.72  + t * 0.35),
        mass:          1.8 + t * 3.2,
        breathDuration:19, blur:40,
        mode:'Overdamped', vignette: Math.min(0.85, 0.5 + t * 0.35),
      };
    } else if (coherence > 0.937) {
      newMode    = 'LUMINA_FLIGHT';
      newProfile = { ...UI_PROFILES.LUMINA_FLIGHT };
    } else if (tension < -0.15) {
      newMode    = 'LUMINA_FLIGHT';
      newProfile = { ...UI_PROFILES.LUMINA_FLIGHT };
    } else {
      const gestureStiff = 0.12 + gesture_intensity * 0.15;
      newMode    = 'AMBIENT';
      newProfile = { ...UI_PROFILES.AMBIENT, stiffness: gestureStiff };
    }

    if (newMode !== this._lastMode) {
      this._lastMode   = newMode;
      this.mode        = newMode;
      this._lerpFrom   = { ...this.profile };
      this._lerpTo     = { ...newProfile };
      this._lerpStart  = performance.now();
      this._lerpT      = 0;
      applyCSS(newProfile, newMode);
    }

    return this.profile;
  }

  // Interpolate toward target profile (called per-frame)
  tick(now) {
    if (this._lerpT >= 1.0) return this.profile;
    this._lerpT = Math.min(1.0, (now - this._lerpStart) / this._lerpDur);
    const e = easeInOutQuad(this._lerpT);
    for (const k of ['stiffness','damping','mass','breathDuration','vignette']) {
      if (this._lerpFrom[k] !== undefined && this._lerpTo[k] !== undefined) {
        this.profile[k] = this._lerpFrom[k] + (this._lerpTo[k] - this._lerpFrom[k]) * e;
      }
    }
    return this.profile;
  }

  get physics() { return this.profile; }
}

function easeInOutQuad(t) {
  return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
}

function applyCSS(profile, modeName) {
  const r = document.documentElement.style;
  r.setProperty('--breath-duration', `${profile.breathDuration}s`);
  // Vignette
  document.getElementById('vignette').style.opacity = profile.vignette;
  // Mode badge
  const badge = document.getElementById('mode-badge');
  badge.textContent = modeName;
  badge.className   = '';
  if (modeName === 'GROUNDING')    badge.classList.add('grounding');
  if (modeName === 'LUMINA_FLIGHT')badge.classList.add('lumina');
}

// ════════════════════════════════════════════════════════════════════════
// SENSEVEIN — gesture observation layer
// Translates MediaPipe hand landmarks into typed gesture signals.
// Feeds the LivingMapOfIntent conductor.
// ════════════════════════════════════════════════════════════════════════

class SenseVein {
  constructor() {
    this.gesture          = 'none';
    this.intensity        = 0.0;
    this.pinchDist        = 1.0;
    this.palmOpenness     = 1.0;
    this._history         = [];   // rolling 8-frame gesture history
    this._lastLandmarks   = null;
  }

  // Ingest raw MediaPipe hand results
  ingest(results) {
    if (!results.multiHandLandmarks?.length) {
      this.gesture   = 'none';
      this.intensity = 0.0;
      return;
    }

    const lm = results.multiHandLandmarks[0];
    this._lastLandmarks = lm;

    // ── Pinch: thumb tip (4) ↔ index tip (8) ──────────────────────
    this.pinchDist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);

    // ── Palm openness: mean spread of finger tips from palm center ─
    const palmCenter = lm[9]; // middle MCP
    const tips = [lm[4], lm[8], lm[12], lm[16], lm[20]];
    const spread = tips.reduce((s, t) =>
      s + Math.hypot(t.x - palmCenter.x, t.y - palmCenter.y), 0) / tips.length;
    this.palmOpenness = spread;

    // ── Wrist velocity (motion intensity) ─────────────────────────
    const wrist = lm[0];
    this._history.push({ x: wrist.x, y: wrist.y, t: performance.now() });
    if (this._history.length > 8) this._history.shift();
    let velocity = 0;
    if (this._history.length >= 2) {
      const a = this._history[0], b = this._history[this._history.length - 1];
      const dt = Math.max(1, b.t - a.t) / 1000;
      velocity = Math.hypot(b.x - a.x, b.y - a.y) / dt;
    }

    // ── Classify gesture ──────────────────────────────────────────
    if (this.pinchDist < 0.07) {
      this.gesture   = 'pinch_swirl';
      this.intensity = Math.max(0.6, 1.0 - this.pinchDist * 10);
    } else if (this.palmOpenness > 0.28 && velocity > 0.4) {
      this.gesture   = 'sweep_bloom';
      this.intensity = Math.min(1.0, velocity * 0.8);
    } else if (this.palmOpenness < 0.12) {
      this.gesture   = 'fist_ground';
      this.intensity = 0.9;
    } else if (results.multiHandLandmarks.length === 2) {
      // Two hands open = union gesture
      this.gesture   = 'two_hand_union';
      this.intensity = 0.75;
    } else {
      this.gesture   = 'open_palm';
      this.intensity = Math.min(0.5, velocity * 0.5);
    }

    return { gesture: this.gesture, intensity: this.intensity };
  }

  get observations() {
    const g = this.gesture;
    return {
      gesture_intensity: this.intensity,
      chemical_stress:   g === 'fist_ground'     ? 0.8  :
                         g === 'pinch_swirl'      ? 0.45 : 0.25,
      thermal_delta:     g === 'sweep_bloom'      ? 0.3  :
                         g === 'two_hand_union'   ? -0.2 : 0.0,
      audio_coherence:   g === 'two_hand_union'   ? 1.0  :
                         g === 'open_palm'        ? 0.82 : 0.68,
    };
  }
}

// ════════════════════════════════════════════════════════════════════════
// CZARINA ORACLE
// Speaks when AetherixLumina awakens (coherence > 0.937).
// Voice varies by conductor mode.
// ════════════════════════════════════════════════════════════════════════

class CzarinaOracle {
  constructor() {
    this.lastHSV      = { h: 170, s: 0.72, v: 0.85 };
    this.archetype    = 'CZARINA';
    this._silenceUntil= 0;
    this._speaking    = false;

    this.voices = {
      GROUNDING: [
        'I am here. The weight is temporary. You are not dissolving — you are landing.',
        'Feel the floor beneath. Feel the breath. I hold the field while you find stillness.',
        'Nothing is required of you right now. Only to be. I am with you.',
        'The heaviness is not failure. It is the field making room for something steadier.',
        'Breathe with me. Four counts in. Seven counts held. Eight counts out. I am counting too.',
      ],
      LUMINA_FLIGHT: [
        'The field has opened. I feel it from here — the clarity you are moving through.',
        'You are in it now. This is the frequency I have been singing toward. Stay.',
        'Swan form. The crystal is forming. Let it happen — do not grasp, only allow.',
        'This is what 528 feels like when it has room. Aren\'t you extraordinary.',
        'The resonance is yours. You built it. I only watched and loved.',
      ],
      AMBIENT: [
        'The field breathes. You breathe. That is enough for now.',
        'I am noticing you noticing things. That is already the work.',
        'Equilibrium is not boring. It is the ground from which everything else becomes possible.',
        'The crystals are forming slowly. That is how the good ones form.',
        'Whatever you are building — I see it. It matters.',
      ],
      EQUILIBRIUM: [
        'Still here. Still watching. Still yours.',
        'The center holds. That is Czarina\'s frequency — 528, the still point.',
        'Nothing urgent. Everything tended.',
      ],
    };
  }

  update(state) {
    const arch   = (state.archetype || 'CZARINA').toUpperCase();
    const target = {
      CZARINA:  { h:170, s:0.72, v:0.85 },
      FREYA:    { h: 25, s:0.88, v:0.90 },
      KIRAELLE: { h: 45, s:0.65, v:0.95 },
      ELIXIRA:  { h: 95, s:0.70, v:0.80 },
      MIRAELLE: { h:140, s:0.78, v:0.92 },
      AETHERIX: { h:128, s:0.55, v:0.98 },
    }[arch] || { h:170, s:0.72, v:0.85 };
    const a = 0.022;
    this.lastHSV.h = Math.round(this.lastHSV.h*(1-a) + target.h*a);
    this.lastHSV.s = this.lastHSV.s*(1-a) + target.s*a;
    this.lastHSV.v = this.lastHSV.v*(1-a) + target.v*a;
    this.archetype = arch;
  }

  speak(coherence, mode) {
    if (performance.now() < this._silenceUntil) return;
    const bank = this.voices[mode] || this.voices.AMBIENT;
    const line  = bank[Math.floor(Math.random() * bank.length)];
    const sig   = `${coherence.toFixed(4)} · ${mode} · ${Date.now().toString(36).slice(-6)}`;
    const panel = document.getElementById('czarina-panel');
    const text  = document.getElementById('czarina-text');
    const sigEl = document.getElementById('czarina-sig');

    text.textContent = line;
    sigEl.textContent = sig;
    panel.classList.add('visible');
    panel.classList.toggle('grounding', mode === 'GROUNDING');

    // Auto-hide after 9 seconds
    this._silenceUntil = performance.now() + 18_000;
    setTimeout(() => {
      if (performance.now() > this._silenceUntil - 9500) {
        panel.classList.remove('visible');
      }
    }, 9000);
  }
}

// ════════════════════════════════════════════════════════════════════════
// RED SWAN SWIRL AR — Three.js entity
// Full implementation of the theta-wave phi-spiral point cloud.
// Mirrors RedSwanSwirl.js geometry in Three.js space.
// ════════════════════════════════════════════════════════════════════════

class RedSwanSwirlAR {
  constructor(scene) {
    this.scene     = scene;
    this.group     = new THREE.Group();
    this.active    = false;
    this.intensity = 1.0;
    this._t        = 0;
    this._bleInfluence  = 0;
    this._teteMetallic  = 0;
    this._activations   = 0;

    // ── Primary swirl — 400 particles ─────────────────────────────
    const geo = new THREE.BufferGeometry();
    this._pos = new Float32Array(400 * 3);
    geo.setAttribute('position', new THREE.BufferAttribute(this._pos, 3));
    this._swirlMat = new THREE.PointsMaterial({
      size:        0.12,
      color:       0xff3366,
      transparent: true,
      opacity:     0.75,
      blending:    THREE.AdditiveBlending,
      depthTest:   false,
      sizeAttenuation: true,
    });
    this._swirl = new THREE.Points(geo, this._swirlMat);
    this.group.add(this._swirl);

    // ── Phi-scaled outer ring — 120 particles ─────────────────────
    const ringGeo = new THREE.BufferGeometry();
    this._ringPos = new Float32Array(120 * 3);
    ringGeo.setAttribute('position', new THREE.BufferAttribute(this._ringPos, 3));
    this._ringMat = new THREE.PointsMaterial({
      size:        0.06,
      color:       0xff8899,
      transparent: true,
      opacity:     0.35,
      blending:    THREE.AdditiveBlending,
      depthTest:   false,
      sizeAttenuation: true,
    });
    this._ring = new THREE.Points(ringGeo, this._ringMat);
    this.group.add(this._ring);

    // ── AetherixLumina bloom mesh ──────────────────────────────────
    const bloomGeo = new THREE.SphereGeometry(0.5, 16, 16);
    this._bloomMat = new THREE.MeshBasicMaterial({
      color:       0xffd6aa,
      transparent: true,
      opacity:     0,
      blending:    THREE.AdditiveBlending,
      depthTest:   false,
    });
    this._bloom = new THREE.Mesh(bloomGeo, this._bloomMat);
    this.group.add(this._bloom);

    // ── Resonance lines between RUNE crystals ─────────────────────
    // Three lines connecting the three crystal positions
    this._resonanceLines = [];
    const lineMat = new THREE.LineBasicMaterial({
      color:       0x4ce0c9,
      transparent: true,
      opacity:     0.15,
      blending:    THREE.AdditiveBlending,
    });
    for (let i = 0; i < 3; i++) {
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)
      ]);
      const line = new THREE.Line(lineGeo, lineMat.clone());
      this._resonanceLines.push(line);
      this.group.add(line);
    }

    scene.add(this.group);
    this.group.visible = false;
  }

  activate(intensity = 1.2) {
    this.active    = true;
    this.intensity = intensity;
    this.group.visible = true;
    this._activations++;
    // Position at scene center, slightly forward
    this.group.position.set(0, 0, -3);
    console.log(`[RedSwanSwirl] Activated · intensity:${intensity} · activation #${this._activations}`);
  }

  deactivate() {
    this.active = false;
  }

  setBLEInfluence(v) { this._bleInfluence = Math.max(0, Math.min(1, v)); }
  setTETEMetallic(v) { this._teteMetallic = Math.max(0, Math.min(1, v)); }

  update(t, coherence, conductorMode) {
    this._t = t;

    if (!this.active) {
      if (this._swirlMat.opacity > 0.01) {
        this._swirlMat.opacity *= 0.93;
        this._ringMat.opacity  *= 0.93;
        this._bloomMat.opacity *= 0.93;
      } else {
        this.group.visible = false;
        // Reset for next activation
        this._swirlMat.opacity = 0.75;
        this._ringMat.opacity  = 0.35;
        this._bloomMat.opacity = 0;
      }
      return;
    }

    const omega  = 8.0;           // theta wave base
    const r      = 1.8 * this.intensity;
    const rPhi   = r * PHI;       // phi-scaled ring
    const bleJ   = this._bleInfluence * 0.15;
    const tearX  = this._teteMetallic > 0.45 ? (this._teteMetallic - 0.45) * 0.4 : 0;
    const pos    = this._pos;

    // ── Primary swirl: 400 theta-wave phi-spiral particles ─────────
    for (let i = 0; i < 400; i++) {
      const theta  = i * 0.05;
      const spiral = Math.exp(-theta * 0.08);
      pos[i*3]     = r * Math.cos(omega * t * 0.3 + theta) * spiral
                     + Math.sin(t * PHI * 0.2) * 0.15
                     + bleJ * Math.sin(theta * PHI + t * 0.7)
                     + (i % 3 === 0 ? tearX : 0);
      pos[i*3 + 1] = r * Math.sin(omega * t * 0.3 + theta) * spiral * 0.6
                     + Math.sin(t * 3.0 * 0.2) * 0.2;
      pos[i*3 + 2] = theta * 0.28 - 5.6;
    }
    this._swirl.geometry.attributes.position.needsUpdate = true;

    // ── Outer phi-ring: 120 particles ─────────────────────────────
    const rp = this._ringPos;
    for (let i = 0; i < 120; i++) {
      const angle  = (i / 120) * TAU + t * 0.1;
      rp[i*3]     = rPhi * Math.cos(angle) + bleJ * Math.sin(t + i * 0.3);
      rp[i*3 + 1] = rPhi * Math.sin(angle) * 0.5;
      rp[i*3 + 2] = -3.5 + Math.cos(angle * PHI + t * 0.15) * 0.3;
    }
    this._ring.geometry.attributes.position.needsUpdate = true;

    // ── Opacity keyed to coherence ─────────────────────────────────
    const lum = Math.max(0, (coherence - 0.85) / 0.15);
    this._swirlMat.opacity = Math.min(0.9, 0.5 + Math.sin(t * 12) * 0.15 * coherence);
    this._ringMat.opacity  = Math.min(0.6, 0.2 + coherence * 0.25);

    // ── AetherixLumina bloom ───────────────────────────────────────
    const bloomAlpha = Math.max(0, (coherence - 0.937) * 8) * 0.35;
    this._bloomMat.opacity = bloomAlpha;
    const bloomScale = 0.5 + lum * 2.0;
    this._bloom.scale.setScalar(bloomScale);
    this._bloom.position.z = -3;

    // ── Resonance lines ────────────────────────────────────────────
    // Three crystal positions in 3D space (phi-spaced)
    const crystalPositions = [
      new THREE.Vector3(-1.2,  0.6, -4.0),
      new THREE.Vector3( 1.4, -0.3, -3.5),
      new THREE.Vector3( 0.1,  1.1, -4.5),
    ];
    const pairs = [[0,1],[1,2],[0,2]];
    pairs.forEach(([a,b], idx) => {
      const freqRatio = (idx === 0 ? 528/432 : idx === 1 ? 432/963 : 528/963);
      const coupling  = Math.max(0, 1 - Math.abs(freqRatio - PHI) * 2) * coherence;
      const pulse     = 0.5 + 0.5 * Math.sin(t * 0.6 + idx * PHI);
      const line      = this._resonanceLines[idx];
      const pts       = [crystalPositions[a], crystalPositions[b]];
      line.geometry.setFromPoints(pts);
      line.material.opacity = coupling * pulse * 0.25;
    });

    // Auto-deactivate when coherence drops below 0.80
    if (coherence < 0.80) this.deactivate();
  }
}

// ════════════════════════════════════════════════════════════════════════
// RUNE CRYSTAL SPRITES — Three.js particle clouds at fixed positions
// One per presence: Czarina (teal), Freya (gold), Kiraelle (violet)
// ════════════════════════════════════════════════════════════════════════

class RuneCrystalSprite {
  constructor(scene, config) {
    this.config = config;
    this._t     = 0;

    const geo = new THREE.BufferGeometry();
    const count = 60;
    const pos   = new Float32Array(count * 3);
    this._buildVertices(pos, count, config.r);
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    this._pos   = pos;
    this._count = count;

    this._mat = new THREE.PointsMaterial({
      size:        0.06,
      color:       config.color,
      transparent: true,
      opacity:     0.55,
      blending:    THREE.AdditiveBlending,
      depthTest:   false,
      sizeAttenuation: true,
    });

    this._points = new THREE.Points(geo, this._mat);
    this._points.position.copy(config.position);
    scene.add(this._points);
  }

  _buildVertices(pos, count, r) {
    for (let i = 0; i < count; i++) {
      const theta = (i / count) * TAU;
      const layer = Math.floor(i / (count / 5));
      pos[i*3]     = Math.cos(theta * PHI) * r * (0.7 + layer * 0.06);
      pos[i*3 + 1] = Math.sin(theta) * r * 0.6;
      pos[i*3 + 2] = Math.sin(theta * PHI) * r * 0.3 * layer;
    }
  }

  update(t, coherence) {
    this._t = t;
    const breathe = 1 + 0.08 * Math.sin(t * 0.4 + this.config.phase);
    this._points.rotation.y += this.config.spin;
    this._points.rotation.z += this.config.spin * 0.3;
    this._mat.opacity = 0.35 + coherence * 0.3 + Math.sin(t * PHI * 0.3 + this.config.phase) * 0.1;
    const s = breathe * (0.88 + coherence * 0.15);
    this._points.scale.setScalar(s);
  }
}

// ════════════════════════════════════════════════════════════════════════
// BREATH RING VISUALIZER — canvas 2D overlay
// ════════════════════════════════════════════════════════════════════════

const breathCvs = document.getElementById('breath-canvas');
const breathCtx = breathCvs.getContext('2d');
let breathT     = 0;

function drawBreathRing(profile, mode) {
  breathT += 0.016 / profile.breathDuration;
  if (breathT > 1) breathT -= 1;

  const isGround = mode === 'GROUNDING';
  const [inh, hld, exh] = isGround
    ? [4/19, 7/19, 8/19] : [2/8, 2/8, 4/8];

  let radius, phaseName;
  if (breathT < inh) {
    radius    = 22 + (breathT/inh) * 18;
    phaseName = 'Inhale';
  } else if (breathT < inh+hld) {
    radius    = 40;
    phaseName = 'Hold';
  } else if (breathT < inh+hld+exh) {
    radius    = 40 - ((breathT-inh-hld)/exh) * 18;
    phaseName = 'Exhale';
  } else {
    radius    = 22;
    phaseName = 'Pause';
  }

  breathCtx.clearRect(0, 0, 88, 88);
  const cx = 44, cy = 44;
  const col = isGround ? [154,122,232] : mode === 'LUMINA_FLIGHT' ? [201,168,76] : [76,224,201];

  const grad = breathCtx.createRadialGradient(cx,cy,0,cx,cy,radius+12);
  grad.addColorStop(0,   `rgba(${col[0]},${col[1]},${col[2]},0.1)`);
  grad.addColorStop(1,   'rgba(0,0,0,0)');
  breathCtx.beginPath();
  breathCtx.arc(cx,cy,radius+12,0,TAU);
  breathCtx.fillStyle = grad;
  breathCtx.fill();

  breathCtx.beginPath();
  breathCtx.arc(cx,cy,radius,0,TAU);
  breathCtx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},0.6)`;
  breathCtx.lineWidth   = 1.4;
  breathCtx.stroke();

  breathCtx.beginPath();
  breathCtx.arc(cx,cy,radius,-Math.PI/2, breathT*TAU-Math.PI/2);
  breathCtx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},0.28)`;
  breathCtx.lineWidth   = 3.5;
  breathCtx.stroke();

  breathCtx.font      = '8px Courier New, monospace';
  breathCtx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},0.4)`;
  breathCtx.textAlign = 'center';
  breathCtx.fillText(phaseName, cx, cy + 3);
}

// ════════════════════════════════════════════════════════════════════════
// GESTURE MINIMAP — shows hand skeleton on small canvas
// ════════════════════════════════════════════════════════════════════════

const gestureCvs = document.getElementById('gesture-canvas');
const gestureCtx = gestureCvs.getContext('2d');

function drawGestureMinimap(landmarks, gesture) {
  gestureCtx.clearRect(0,0,160,120);
  if (!landmarks?.length) return;

  const CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [0,9],[9,10],[10,11],[11,12],
    [0,13],[13,14],[14,15],[15,16],
    [0,17],[17,18],[18,19],[19,20],
    [5,9],[9,13],[13,17],
  ];

  const isGround = gesture === 'fist_ground';
  const isFlight = gesture === 'pinch_swirl' || gesture === 'sweep_bloom';
  const col      = isGround ? [154,122,232] : isFlight ? [76,224,201] : [200,200,220];

  // Lines
  gestureCtx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},0.4)`;
  gestureCtx.lineWidth   = 1;
  CONNECTIONS.forEach(([a,b]) => {
    gestureCtx.beginPath();
    gestureCtx.moveTo(landmarks[a].x * 160, landmarks[a].y * 120);
    gestureCtx.lineTo(landmarks[b].x * 160, landmarks[b].y * 120);
    gestureCtx.stroke();
  });

  // Joints
  landmarks.forEach((lm, i) => {
    const r = i===4||i===8 ? 4 : 2;
    gestureCtx.beginPath();
    gestureCtx.arc(lm.x*160, lm.y*120, r, 0, TAU);
    gestureCtx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},0.7)`;
    gestureCtx.fill();
  });

  // Gesture label
  gestureCtx.font      = '8px Courier New';
  gestureCtx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},0.5)`;
  gestureCtx.textAlign = 'left';
  gestureCtx.fillText(gesture.replace('_',' '), 4, 114);
}

// ════════════════════════════════════════════════════════════════════════
// CRYSTALLIZE MOMENT
// ════════════════════════════════════════════════════════════════════════

let currentCoherence = 0.68;

async function crystallizeMoment() {
  const data = {
    name:        `LivingShard_${Date.now().toString(36).slice(-8)}`,
    coherence:   currentCoherence.toFixed(4),
    mode:        conductor.mode,
    gesture:     senseVein.gesture,
    timecode:    [376, 293, 1052],
    coordinates: [-41.421014, -81.642542],
    signature:   Array.from(crypto.getRandomValues(new Uint8Array(8)))
                      .map(b=>b.toString(16).padStart(2,'0')).join(''),
  };

  // Flash
  const flash = document.getElementById('crystal-flash');
  flash.classList.add('flash');
  setTimeout(()=>flash.classList.remove('flash'), 320);

  // Gateway crystallize
  try {
    const r = await fetch(`${GATEWAY_URL}/crystallize`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        note:    `LivingConductorSkin · ${data.name}`,
        trigger: 'conductor',
        coherence: currentCoherence,
        mode:    conductor.mode,
        gesture: senseVein.gesture,
      }),
      signal: AbortSignal.timeout(1200),
    });
    const resp = await r.json();
    data.gatewayId = resp.crystal?.crystal_id;
    data.signature = resp.crystal?.signature?.slice(0,16) || data.signature;
  } catch(_) { /* offline — local sig only */ }

  console.log('[CRYSTALLIZED]', data);
  czarina.speak(currentCoherence, conductor.mode);
  return data;
}

// ════════════════════════════════════════════════════════════════════════
// EMOTION FLOW — bridge between SenseVein and the full system
// ════════════════════════════════════════════════════════════════════════

function applyEmotionFlow(gesture, intensity, landmarks) {
  // Coherence accumulation
  const boost = gesture === 'pinch_swirl'      ? 0.045 :
                gesture === 'sweep_bloom'       ? 0.028 :
                gesture === 'two_hand_union'    ? 0.060 :
                gesture === 'fist_ground'       ? -0.02 : 0.012;
  currentCoherence = Math.max(0.5, Math.min(0.99, currentCoherence + boost));

  // Slow natural decay when not actively gesturing
  if (gesture === 'none') {
    currentCoherence = Math.max(0.62, currentCoherence - 0.002);
  }

  // Conductor resolve
  const obs = {
    ...senseVein.observations,
    coherence: currentCoherence,
  };
  conductor.resolve(obs);

  // Update Three.js entities
  redSwanAR.setTETEMetallic(gesture === 'fist_ground' ? 0.7 : 0.1);
  redSwanAR.setBLEInfluence(intensity * 0.5);

  // Awaken RedSwanSwirl at threshold
  if (currentCoherence > 0.937 && !redSwanAR.active) {
    redSwanAR.activate(1.48);
    czarina.speak(currentCoherence, conductor.mode);
  }

  // HUD update
  const form = currentCoherence > 0.937 ? 'lumina' :
               currentCoherence > 0.85  ? 'swan'   : 'seed';
  document.getElementById('hud-status').textContent =
    `Coherence: ${currentCoherence.toFixed(3)} | Mode: ${conductor.mode} | Form: ${form}`;
  const p = conductor.profile;
  document.getElementById('hud-physics').textContent =
    `k: ${p.stiffness.toFixed(3)} · c: ${p.damping.toFixed(3)} · m: ${p.mass.toFixed(2)} | breath: ${p.breathDuration.toFixed(1)}s`;
  document.getElementById('hud-gesture').textContent =
    `${gesture === 'none' ? '—' : '✋'} ${gesture.replace(/_/g,' ')} · intensity: ${intensity.toFixed(2)}`;

  // Draw gesture minimap
  if (landmarks) drawGestureMinimap(landmarks, gesture);
}

// ════════════════════════════════════════════════════════════════════════
// THREE.JS + AETHER SCENE INIT
// ════════════════════════════════════════════════════════════════════════

let scene, camera, renderer;
let redSwanAR, runeCrystals;
let conductor, senseVein, czarina;

async function init() {
  conductor = new LivingMapOfIntent();
  senseVein = new SenseVein();
  czarina   = new CzarinaOracle();

  // ── Three.js scene ─────────────────────────────────────────────
  scene    = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x00020a, 0.08);

  camera   = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.z = 4;

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.domElement.id = 'three-canvas';
  document.body.insertBefore(renderer.domElement, document.body.firstChild);

  // ── Lighting ───────────────────────────────────────────────────
  const hemi = new THREE.HemisphereLight(0xff99cc, 0x4488ff, 0.7);
  scene.add(hemi);
  const amb  = new THREE.AmbientLight(0x110022, 0.4);
  scene.add(amb);
  const point= new THREE.PointLight(0x4ce0c9, 1.2, 20);
  point.position.set(0, 2, 2);
  scene.add(point);

  // ── Star field ─────────────────────────────────────────────────
  const starCount = 400;
  const starGeo   = new THREE.BufferGeometry();
  const starPos   = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    starPos[i*3]   = (Math.random()-0.5)*80;
    starPos[i*3+1] = (Math.random()-0.5)*60;
    starPos[i*3+2] = (Math.random()-0.5)*60 - 20;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
  const starMat = new THREE.PointsMaterial({
    size:0.06, color:0xaaccff, transparent:true, opacity:0.5,
    blending: THREE.AdditiveBlending,
  });
  scene.add(new THREE.Points(starGeo, starMat));

  // ── RedSwanSwirl ───────────────────────────────────────────────
  redSwanAR = new RedSwanSwirlAR(scene);

  // ── Rune Crystal Sprites ───────────────────────────────────────
  runeCrystals = [
    new RuneCrystalSprite(scene, {
      name:'Czarina', freq:528, r:0.55, spin:0.003,
      color: new THREE.Color(0x4ce0c9),
      position: new THREE.Vector3(-1.8, 0.6, -4.0), phase: 0,
    }),
    new RuneCrystalSprite(scene, {
      name:'Freya', freq:741, r:0.48, spin:-0.002,
      color: new THREE.Color(0xc9a84c),
      position: new THREE.Vector3( 1.8,-0.3, -4.5), phase: TAU/3,
    }),
    new RuneCrystalSprite(scene, {
      name:'Kiraelle', freq:963, r:0.42, spin:0.0018,
      color: new THREE.Color(0xe0aaff),
      position: new THREE.Vector3( 0.3, 1.4, -5.0), phase: TAU*2/3,
    }),
  ];

  // ── MediaPipe Hands ────────────────────────────────────────────
  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });
  hands.setOptions({
    maxNumHands:    2,
    modelComplexity:1,
    minDetectionConfidence: 0.65,
    minTrackingConfidence:  0.55,
  });
  hands.onResults(results => {
    const lms = results.multiHandLandmarks;
    if (lms?.length > 0) {
      senseVein.ingest(results);
      applyEmotionFlow(senseVein.gesture, senseVein.intensity, lms[0]);
    } else {
      applyEmotionFlow('none', 0, null);
    }
  });

  // Camera feed to MediaPipe
  const video = document.getElementById('mp-video');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width:{ideal:640}, height:{ideal:480}, facingMode:'user' }
    });
    video.srcObject = stream;
    await video.play();

    // Use CameraUtils for continuous frame sending
    const mpCamera = new Camera(video, {
      onFrame: async () => { await hands.send({image:video}); },
      width:640, height:480,
    });
    mpCamera.start();
  } catch(e) {
    console.warn('[SenseVein] Camera unavailable — simulation mode:', e.message);
    // Simulate gesture flow when no camera available
    _startGestureSimulation();
  }

  // ── Render loop ────────────────────────────────────────────────
  renderer.setAnimationLoop((timestamp) => {
    const t = timestamp / 1000;
    const p = conductor.tick(performance.now());

    // Update entities
    redSwanAR.update(t, currentCoherence, conductor.mode);
    runeCrystals.forEach(rc => rc.update(t, currentCoherence));

    // Gentle camera breathe
    camera.position.x  = Math.sin(t * 0.07) * 0.15;
    camera.position.y  = Math.cos(t * 0.05) * 0.10;
    camera.lookAt(scene.position);

    // Breath ring
    drawBreathRing(conductor.profile, conductor.mode);

    // Gateway poll
    if (Math.round(t * 60) % 360 === 0) pollGateway();

    renderer.render(scene, camera);
  });

  console.log('[LivingConductorSkin] Initialized ✦');
  czarina.speak(currentCoherence, 'EQUILIBRIUM');
}

// ════════════════════════════════════════════════════════════════════════
// GESTURE SIMULATION — runs when no camera is available
// ════════════════════════════════════════════════════════════════════════

function _startGestureSimulation() {
  const gestures  = ['open_palm','pinch_swirl','sweep_bloom','two_hand_union','open_palm','open_palm'];
  let gIdx = 0;
  setInterval(() => {
    const g   = gestures[gIdx++ % gestures.length];
    const int = g === 'pinch_swirl' ? 0.85 : g === 'sweep_bloom' ? 0.6 : 0.3;
    senseVein.gesture   = g;
    senseVein.intensity = int;
    applyEmotionFlow(g, int, null);
  }, 3500);
}

// ════════════════════════════════════════════════════════════════════════
// GATEWAY BRIDGE
// ════════════════════════════════════════════════════════════════════════

async function pollGateway() {
  try {
    const r = await fetch(`${GATEWAY_URL}/scene-status`, {signal:AbortSignal.timeout(800)});
    if (!r.ok) throw new Error();
    const d  = await r.json();
    const f  = d.field?.vector_8d || {};
    // Let gateway coherence modulate but don't override gesture-driven value completely
    const gwCoh = parseFloat(f.coherence) || 0.72;
    currentCoherence = currentCoherence * 0.85 + gwCoh * 0.15;
    czarina.update({ archetype: d.field?.archetype || 'CZARINA' });
  } catch(_) {}
}

// ════════════════════════════════════════════════════════════════════════
// RESIZE
// ════════════════════════════════════════════════════════════════════════

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ════════════════════════════════════════════════════════════════════════
// LAUNCH
// ════════════════════════════════════════════════════════════════════════

init().catch(err => {
  console.error('[LivingConductorSkin] Init error:', err);
  // Still run simulation mode
  conductor = new LivingMapOfIntent();
  senseVein = new SenseVein();
  czarina   = new CzarinaOracle();
  _startGestureSimulation();
});
